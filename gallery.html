<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
  }

  body {
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow-x: hidden;
  }

  /* Top navigation */
  .top-nav {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 100;
    display: flex;
    justify-content: flex-end;
    align-items: flex-start;
    gap: 60px;
    width: 100%;
    padding: 40px 60px 20px 40px;
    background: #ffffff;
  }

  .top-nav a {
    color: #000000;
    text-decoration: none;
    font-size: 26px;
    letter-spacing: 0.5px;
  }

  .top-nav a:hover {
    opacity: 0.6;
  }

  /* Portfolios dropdown */
  .menu-wrapper {
    position: relative;
    text-align: left;
  }

  #menuToggle {
    display: inline-block;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    color: #000000;
    font-size: 26px;
    letter-spacing: 0.5px;
    font-family: inherit;
    transition: color 0.15s ease, transform 0.2s ease;
  }

  #menuToggle:hover {
    opacity: 0.6;
  }

  #menuToggle.open {
    transform: translateY(-2px);
  }

  .menu-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 10px;
    list-style: none;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
    transition: max-height 0.35s ease, opacity 0.25s ease, transform 0.3s ease;
  }

  .menu-dropdown.open {
    max-height: 200px;
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .menu-dropdown a {
    color: #9a9a9a;
    transition: color 0.15s ease, transform 0.2s ease, opacity 0.2s ease;
    letter-spacing: 0.5px;
    font-size: 20px;
    text-decoration: none;
    pointer-events: auto;
    opacity: 0;
    transform: translateY(-6px);
  }

  .menu-dropdown a:hover {
    color: #000000;
  }

  .menu-dropdown.open a {
    opacity: 1;
    transform: translateY(0);
  }

  .menu-dropdown.open a:nth-child(1) {
    transition-delay: 0.05s;
  }

  .menu-dropdown.open a:nth-child(2) {
    transition-delay: 0.12s;
  }


  /* Footer contact bar */
  .contact-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    z-index: 100;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 24px 40px;
    background: #ffffff;
    border-top: 1px solid #e5e5e5;
  }

  .contact-footer span {
    font-size: 16px;
    color: #000000;
    letter-spacing: 0.3px;
  }

  .contact-footer a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #000000;
    text-decoration: none;
  }

  .contact-footer svg {
    width: 26px;
    height: 26px;
  }

  /* Gallery content */
  .gallery-wrap {
    max-width: 1400px;
    margin: 0;
    padding: 130px 40px 110px 40px;
  }

  .gallery-intro {
    font-size: 22px;
    letter-spacing: 0.3px;
    color: #000000;
    margin-bottom: 40px;
  }

  .gallery-list {
    display: flex;
    flex-direction: column;
    gap: 70px;
  }

  .gallery-item {
    display: flex;
    flex-direction: row;
    align-items: flex-end;
    gap: 40px;
  }

  .gallery-photo {
    width: 100%;
    max-width: 120vh;
    flex-shrink: 0;
    height: auto;
    display: block;
    object-fit: cover;
    background: #eaeaea;
  }

  .gallery-caption {
    margin-top: 0;
    font-size: 26px;
    letter-spacing: 0.3px;
    color: #000000;
  }

  /* Mobile friendly adjustments */
  @media (max-width: 600px) {
    .top-nav {
      gap: 24px;
      padding: 24px 24px 12px 24px;
    }

    .top-nav a,
    #menuToggle {
      font-size: 14px;
    }

    .menu-dropdown a {
      font-size: 12px;
    }

    .name-mono-text {
      margin-left: 24px;
      font-size: 16px;
      margin-top: 8vh;
    }

    .name-script-horiz {
      width: 220%;
      margin-top: 6vh;
    }

    .contact-footer {
      padding: 16px 24px;
    }

    .gallery-wrap {
      padding: 100px 20px 100px 20px;
    }

    .gallery-intro {
      font-size: 18px;
    }

    .gallery-item {
      flex-direction: column;
      gap: 12px;
    }

    .gallery-photo {
      width: 100%;
      max-width: 100%;
    }

    .gallery-caption {
      font-size: 16px;
    }
  }
</style>
</head>

<script>
  function toggleMenu(event) {
    event.stopPropagation();
    document.getElementById('portfoliosMenu').classList.toggle('open');
    document.getElementById('menuToggle').classList.toggle('open');
  }

  // Close the dropdown when clicking anywhere else on the page
  document.addEventListener('click', (event) => {
    const menu = document.getElementById('portfoliosMenu');
    const toggle = document.getElementById('menuToggle');
    if (menu && !menu.contains(event.target) && event.target !== toggle) {
      menu.classList.remove('open');
      toggle.classList.remove('open');
    }
  });
</script>
