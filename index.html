  <!-- ===== Featured carousel =====
       To add or reorder an item: copy one .carousel__slide block.
       data-caption is the text under the image; data-href is where
       clicking the image goes. Tech items link to a tech page + #id,
       which opens that project with its description expanded. -->

  <div class="carousel">
    <div class="carousel__stage">

      <button class="carousel__arrow" type="button" data-dir="-1" aria-label="Previous work">&lsaquo;</button>

      <div class="carousel__frame" id="frame">

        <div class="carousel__slide is-active"
             data-caption="SUPERBOWL for PILIPINA, Spring 2026"
             data-href="pilipina.html">
          <a href="pilipina.html" tabindex="-1">
            <img src="images/superbowl_zoom.png" alt="Maroon jersey crop top and matching flared trousers from the Superbowl look.">
          </a>
        </div>

        <div class="carousel__slide"
             data-caption="SWAMP GIRLS, Autumn 2025"
             data-href="swampgirls.html">

            <img src="images/tidepool_bathroom1_square.png" alt="Full-length white column dress with a raw-edged hem, worn with a green knit shrug.">
          </a>
        </div>

        <div class="carousel__slide"
             data-caption="Paper circuit art lesson"
             data-href="tech_nonresearch.html#paper-circuit">
          <a href="tech_nonresearch.html#paper-circuit" tabindex="-1">
            <img src="images/robot_art.png" alt="Robot cut from purple paper on a pink sheet, with a red heart and two yellow LED eyes.">
          </a>
        </div>

        <div class="carousel__slide"
             data-caption="3D-printed canine prostheses"
             data-href="tech_nonresearch.html#canine-prostheses">
          <a href="tech_nonresearch.html#canine-prostheses" tabindex="-1">
            <img src="images/jordyfoot.png" alt="Blue 3D-printed canine leg brace with padded lining and two black straps, held in a hand.">
          </a>
        </div>

      </div>

      <button class="carousel__arrow" type="button" data-dir="1" aria-label="Next work">&rsaquo;</button>

    </div>

    <p class="carousel__caption" id="caption" aria-live="polite"></p>
  </div>

</main>

<script>
(function () {
  var frame   = document.getElementById('frame');
  var caption = document.getElementById('caption');
  var slides  = Array.prototype.slice.call(frame.querySelectorAll('.carousel__slide'));
  var index   = 0;

  function show(next) {
    index = (next + slides.length) % slides.length;
    slides.forEach(function (slide, i) {
      var active = i === index;
      slide.classList.toggle('is-active', active);
      var link = slide.querySelector('a');
      if (link) link.tabIndex = active ? 0 : -1;
    });
    var current = slides[index];
    caption.innerHTML =
      '<a href="' + current.dataset.href + '">' + current.dataset.caption + '</a>';
  }

  document.querySelectorAll('.carousel__arrow').forEach(function (button) {
    button.addEventListener('click', function () {
      show(index + Number(button.dataset.dir));
    });
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'ArrowLeft')  show(index - 1);
    if (event.key === 'ArrowRight') show(index + 1);
  });

  var startX = null;
  frame.addEventListener('touchstart', function (e) { startX = e.changedTouches[0].clientX; }, { passive: true });
  frame.addEventListener('touchend', function (e) {
    if (startX === null) return;
    var dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 40) show(index + (dx < 0 ? 1 : -1));
    startX = null;
  }, { passive: true });

  show(0);
}());
</script>
