<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siena Villancio-Wolter</title>
<link rel="stylesheet" href="https://fontlibrary.org/face/anka-coder" type="text/css">
<style>
  :root {
    /* Change these two values to experiment with the whole palette */
    --bg-color: #40D1FF;
    --text-color: #3B1805; /* nav links, name-mono text, footer text, script logo */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
  }

  body {
    background: var(--bg-color);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow-x: hidden;
  }

  /* Top navigation */
  .top-nav {
    display: flex;
    justify-content: flex-end;
    align-items: flex-start;
    gap: 60px;
    padding: 40px 60px 0 40px;
  }

  .top-nav a {
    color: var(--text-color);
    text-decoration: none;
    font-size: 26px;
    letter-spacing: 0.5px;
  }

  .top-nav a:hover {
    opacity: 0.6;
  }

  /* Portfolios dropdown */
  .menu-wrapper {
    position: relative;
    text-align: left;
  }

  #menuToggle {
    display: inline-block;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    color: var(--text-color);
    font-size: 26px;
    letter-spacing: 0.5px;
    font-family: inherit;
    transition: color 0.15s ease, transform 0.2s ease;
  }

  #menuToggle:hover {
    opacity: 0.6;
  }

  #menuToggle.open {
    transform: translateY(-2px);
  }

  .menu-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 10px;
    list-style: none;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
    transition: max-height 0.35s ease, opacity 0.25s ease, transform 0.3s ease;
  }

  .menu-dropdown.open {
    max-height: 200px;
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .menu-dropdown a {
    color: var(--text-color);
    transition: color 0.15s ease, transform 0.2s ease, opacity 0.2s ease;
    letter-spacing: 0.5px;
    font-size: 20px;
    text-decoration: none;
    pointer-events: auto;
    opacity: 0.6;
    transform: translateY(-6px);
  }

  .menu-dropdown.open a:hover {
    opacity: 0.6;
  }

  .menu-dropdown.open a {
    opacity: 1;
    transform: translateY(0);
  }

  .menu-dropdown.open a:nth-child(1) {
    transition-delay: 0.05s;
  }

  .menu-dropdown.open a:nth-child(2) {
    transition-delay: 0.12s;
  }

  /* Bracketed name text */
  .name-mono-text {
    margin-top: 8%;
    margin-left: 12%;
    font-size: 30px;
    letter-spacing: 0.5px;
    color: var(--text-color);
  }

  /* Large horizontal name script */
  .name-script-horiz {
    margin-top: -2.5%;
    margin-left: -8%;
    width: 115%;
    height: 100%;
    background-image: url(images/name_script_horiz.svg);
    background-color: var(--text-color);
    -webkit-mask-image: url(images/name_script_horiz.svg);
    mask-image: url(images/name_script_horiz.svg);
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
  }

  /* Footer contact bar */
  .contact-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 24px 40px;
    border-top: 1px solid #e5e5e5;
  }

  .contact-footer span {
    font-size: 16px;
    color: var(--text-color);
    letter-spacing: 0.3px;
  }

  .contact-footer a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--text-color);
    text-decoration: none;
  }

  .contact-footer svg {
    width: 26px;
    height: 26px;
  }

  /* Mobile friendly adjustments */
  @media (max-width: 600px) {
    .top-nav {
      gap: 24px;
      padding: 24px 24px 0 24px;
    }

    .top-nav a,
    #menuToggle {
      font-size: 14px;
    }

    .menu-dropdown a {
      font-size: 12px;
    }

    .name-mono-text {
      margin-left: 24px;
      font-size: 16px;
      margin-top: 8vh;
    }

    .name-script-horiz {
      width: 220%;
      margin-top: 6vh;
    }

    .contact-footer {
      padding: 16px 24px;
    }
  }
</style>
</head>

<script>
  function toggleMenu(event) {
    event.stopPropagation();
    document.getElementById('portfoliosMenu').classList.toggle('open');
    document.getElementById('menuToggle').classList.toggle('open');
  }

  // Close the dropdown when clicking anywhere else on the page
  document.addEventListener('click', (event) => {
    const menu = document.getElementById('portfoliosMenu');
    const toggle = document.getElementById('menuToggle');
    if (menu && !menu.contains(event.target) && event.target !== toggle) {
      menu.classList.remove('open');
      toggle.classList.remove('open');
    }
  });
</script>

<body>

  <nav class="top-nav">
    <a href="about.html">about</a>

    <div class="menu-wrapper">
      <button id="menuToggle" onclick="toggleMenu(event)">portfolios</button>
      <ul class="menu-dropdown" id="portfoliosMenu">
        <li><a href="engineering.html">engineering</a></li>
        <li><a href="fashion.html">fashion</a></li>
      </ul>
    </div>

    <a href="gallery.html">gallery</a>
  </nav>

  <div class="name-mono-text">[Siena Villancio-Wolter]</div>

  <div class="name-script-horiz" role="img" aria-label="Siena Villancio-Wolter"></div>

</body>
