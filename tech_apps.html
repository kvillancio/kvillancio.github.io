<main class="page">

  <!-- ===== Tech index =====
       Items alternate left / right automatically by position, so a
       new project is one pasted <article> block — no class to set.
       The id is what index.html links to (tech_apps.html#the-id),
       which opens that project with its description showing. -->

  <div class="works">

    <article class="work" id="color-generator">
      <button class="work__toggle" type="button"
              aria-expanded="false" aria-controls="desc-color-generator">
        <a href="accessible-color-generator.html" target="_blank" rel="noopener">
          <img src="images/color_combo.png" alt="Generated color combinations shown with their contrast ratios."> 
        </a>
        <span class="work__name">Accessible color scheme generator</span>
      </button>
      <div class="work__desc" id="desc-color-generator">
      </div>
    </article>

    <article class="work" id="spline-designer">
      <button class="work__toggle" type="button"
              aria-expanded="false" aria-controls="desc-spline-designer">
        <a href="spline-designer.html" target="_blank" rel="noopener">
          <img src="images/spline_app.png" alt="Editor showing an ankle exoskeleton torque curve with draggable spline nodes.">
        </a>
        <span class="work__name">Exoskeleton spline generator</span>
      </button>
      <div class="work__desc" id="desc-spline-designer">
      </div>
    </article>


    <!-- Paste to add a project:
    <article class="work" id="your-id">
      <button class="work__toggle" type="button"
              aria-expanded="false" aria-controls="desc-your-id">
        <img src="images/your-image.png" alt="Describe the image.">
        <span class="work__name">Project name</span>
      </button>
      <div class="work__desc" id="desc-your-id">
        <p>Description.</p>
      </div>
    </article>
    -->

  </div>

</main>

<script>
(function () {
  var works = Array.prototype.slice.call(document.querySelectorAll('.work'));

  function open(work, only) {
    if (only) {
      works.forEach(function (other) {
        if (other !== work) {
          other.classList.remove('is-open');
          other.querySelector('.work__toggle').setAttribute('aria-expanded', 'false');
        }
      });
    }
    var isOpen = work.classList.toggle('is-open');
    work.querySelector('.work__toggle').setAttribute('aria-expanded', String(isOpen));
  }

  works.forEach(function (work) {
    work.querySelector('.work__toggle').addEventListener('click', function () {
      open(work, true);
    });
  });

  // Arriving from the home carousel: open the linked project.
  function openFromHash() {
    var id = decodeURIComponent(window.location.hash.slice(1));
    if (!id) return;
    var work = document.getElementById(id);
    if (!work || !work.classList.contains('work')) return;
    works.forEach(function (other) {
      other.classList.remove('is-open');
      other.querySelector('.work__toggle').setAttribute('aria-expanded', 'false');
    });
    work.classList.add('is-open');
    work.querySelector('.work__toggle').setAttribute('aria-expanded', 'true');
    work.scrollIntoView({ block: 'center' });
  }

  window.addEventListener('hashchange', openFromHash);
  openFromHash();
}());
</script>
